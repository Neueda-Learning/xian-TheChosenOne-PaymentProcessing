server:
  name: safepay
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/paymentDB?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: n3u3da!
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.tco.safepay.model.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# Springdoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

logging:
  level:
    root: info
    org.tco.safepay: debug
    org.apache.ibatis: info
    org.springframework.web: info
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/safepay.log
    max-size: 10MB
    max-history: 10
